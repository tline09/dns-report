<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNS-Report – live domain check</title>
<style>
  :root {
    --dark:#1f3a5f; --accent:#c8a24b; --text:#1f2933; --grey:#52606d;
    --hellgrey:#7b8794; --bg:#f4f6f8; --card:#fff;
  }
  * { box-sizing:border-box; }
  body { font-family:'Segoe UI',Arial,sans-serif; background:var(--bg); color:var(--text); margin:0; }
  .wrap { max-width:840px; margin:0 auto; padding:0 20px; }

  header { background:var(--dark); color:#fff; padding:40px 0 34px; }
  header .firma { font-size:13px; font-weight:600; color:var(--accent); letter-spacing:1px; text-transform:uppercase; }
  header h1 { margin:6px 0 8px; font-size:26px; }
  header p { margin:0; opacity:.9; font-size:15px; }

  .search { background:var(--dark); padding:0 0 34px; }
  .search .row { display:flex; gap:10px; flex-wrap:wrap; }
  .search input {
    flex:1; min-width:220px; padding:13px 16px; font-size:16px; border:none;
    border-radius:8px; outline:none;
  }
  .search button {
    background:var(--accent); color:#fff; border:none; padding:13px 26px; font-size:16px;
    font-weight:600; border-radius:8px; cursor:pointer;
  }
  .search button:disabled { opacity:.6; cursor:default; }
  .hint { color:#cfd8e3; font-size:12px; margin-top:8px; }

  #status { padding:20px 0; font-size:14px; color:var(--grey); }
  .spinner {
    display:inline-block; width:16px; height:16px; border:2px solid #cbd2d9;
    border-top-color:var(--dark); border-radius:50%; animation:spin .7s linear infinite;
    vertical-align:middle; margin-right:8px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .error { color:#c0392b; }

  #result { padding-bottom:50px; }

  /* --- report card styles (same look as the PowerShell report) --- */
  section.domain { margin-bottom:34px; }
  .card { background:var(--card); padding:20px 26px; border-bottom:1px solid #eceff1; }
  .card:first-of-type { border-radius:12px 12px 0 0; }
  .card:last-of-type { border-radius:0 0 12px 12px; border-bottom:none; }
  .domainhead { display:flex; align-items:center; justify-content:space-between; background:#fbfcfd; border-top:3px solid var(--accent); }
  .dname { margin:0; font-size:20px; color:var(--dark); }
  .provider { font-size:12px; color:var(--hellgrey); }
  .scorebox { color:#fff; padding:10px 16px; border-radius:10px; font-size:20px; font-weight:700; text-align:center; line-height:1.1; }
  .scorebox small { display:block; font-size:10px; font-weight:400; opacity:.85; }
  h2,h3 { color:var(--dark); }
  h3 { font-size:13px; text-transform:uppercase; letter-spacing:1px; margin:0 0 10px; }
  .sub { font-size:12px; color:var(--hellgrey); margin:0 0 12px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { padding:6px 8px; border-bottom:1px solid #f0f2f4; }
  td:first-child { color:var(--grey); width:180px; }
  .muted { color:#9aa5b1; font-style:italic; }
  .summary { display:flex; flex-wrap:wrap; gap:8px; }
  .summary span { padding:5px 12px; border-radius:20px; font-size:12px; font-weight:600; }
  .ok { background:#e3f6e8; color:#1a7f37; }
  .no { background:#fdeaea; color:#c0392b; }
  .warn { background:#fff4e0; color:#b06f00; }
  .pill { display:inline-block; background:#eef2f7; color:var(--dark); padding:2px 10px; border-radius:12px; font-size:12px; }
  .tips { margin:0; padding-left:18px; font-size:13px; color:var(--grey); }
  .tips li { margin:4px 0; }
  .allok { color:#1a7f37; font-size:13px; margin:0; }

  .actions { margin:14px 0 0; }
  .actions button {
    background:var(--dark); color:#fff; border:none; padding:9px 18px; border-radius:8px;
    font-size:13px; font-weight:600; cursor:pointer; margin-right:8px;
  }

  footer { text-align:center; font-size:12px; color:var(--hellgrey); padding:24px 0 40px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="firma">DNS-Report</div>
    <h1>Live domain check</h1>
    <p>DNS, email security, SSL and WHOIS for any domain – in seconds.</p>
  </div>
</header>

<div class="search">
  <div class="wrap">
    <div class="row">
      <input id="domain" type="text" placeholder="example.ch" autocomplete="off"
             autocapitalize="off" spellcheck="false">
      <button id="go">Check</button>
    </div>
    <div class="hint">Only publicly available DNS/RDAP data is queried. No data is stored.</div>
  </div>
</div>

<div class="wrap">
  <div id="status"></div>
  <div id="result"></div>
</div>

<footer>
  Released under the MIT License &middot; Domain data via RDAP
</footer>

<script>
  const input = document.getElementById("domain");
  const btn = document.getElementById("go");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");

  async function runCheck() {
    const domain = input.value.trim().toLowerCase();
    if (!domain) { input.focus(); return; }

    btn.disabled = true;
    resultEl.innerHTML = "";
    statusEl.innerHTML = '<span class="spinner"></span> Checking <b>' + escapeHtml(domain) + '</b> …';

    try {
      const res = await fetch("/api/check", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ domain }),
      });
      const json = await res.json();

      if (!res.ok) {
        statusEl.innerHTML = '<span class="error">' + escapeHtml(json.error || "Error") + "</span>";
      } else {
        statusEl.innerHTML = "";
        resultEl.innerHTML =
          json.html +
          '<div class="actions"><button onclick="window.print()">Print as PDF</button></div>';
      }
    } catch (e) {
      statusEl.innerHTML = '<span class="error">Network error: ' + escapeHtml(e.message) + "</span>";
    } finally {
      btn.disabled = false;
    }
  }

  function escapeHtml(t) {
    return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  btn.addEventListener("click", runCheck);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") runCheck(); });
  input.focus();
</script>

</body>
</html>
